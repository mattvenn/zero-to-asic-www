* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 var(--ui); }
button, input, select, textarea { font: inherit; color: inherit }
.app { display: block }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel) }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0 }
.brand h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .01em }
.brand .sub { font: 12px var(--mono); color: var(--muted) }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; order: 3; flex: 1 1 100%; min-width: 0 }
.tools { margin-left: auto }
.tab { flex: 0 0 auto; border: 1px solid var(--line); background: transparent; padding: 4px 10px; border-radius: 3px; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.tab .dots { font: 11px var(--mono); margin-left: 6px; opacity: .85 }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.btn { border: 1px solid var(--line); background: var(--die); padding: 4px 10px; border-radius: 3px; cursor: pointer }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn:disabled { opacity: .45; cursor: default }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px }
.sync { font: 12px var(--mono); color: var(--muted) }
main { display: block }
.stage { position: relative; width: 100%; height: max(300px, min(calc(100vw * 0.56), calc(100vh - 96px))); overflow: hidden; background: var(--bg); border-bottom: 1px solid var(--line) }
svg#cv { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; cursor: grab }
svg#cv.panning { cursor: grabbing }
.overlay { position: absolute; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden }
.seg button { border: 0; background: var(--die); padding: 4px 12px; cursor: pointer }
.seg button + button { border-left: 1px solid var(--line) }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg) }
.diagram .keys, .diagram .overlay, .diagram .coords { display: none }
svg#cv.dg { cursor: default }
.dg [data-dinst] { cursor: pointer }
.dg [data-dinst]:hover rect.blk { stroke-width: 2.4 }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); cursor: pointer }
.chip input { margin: 0 }
.coords { position: absolute; right: 12px; bottom: 12px; font: 12px var(--mono); color: var(--muted); background: var(--panel); border: 1px solid var(--line); padding: 2px 8px; border-radius: 3px }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font: 12px var(--mono); padding: 3px 7px; border-radius: 3px; white-space: nowrap; z-index: 3 }
.keys { position: absolute; right: 12px; top: 12px; font: 11px var(--mono); color: var(--muted); text-align: right; line-height: 1.5 }
aside { background: var(--panel); display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); align-items: start; min-width: 0 }
section.box { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 12px 16px; display: grid; gap: 8px; min-width: 0 }
#secChecks { grid-row: span 3 }
section.box > h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; gap: 8px }
section.box > h2 .meta { letter-spacing: 0; text-transform: none; font: 12px var(--mono) }
.empty { color: var(--muted); font-size: 13px }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font: 12px var(--mono) }
.kv dt { color: var(--muted) } .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums }
label.f { display: grid; gap: 2px; font-size: 12px; color: var(--muted) }
input[type=number], input[type=text], select, textarea { background: var(--die); border: 1px solid var(--line); border-radius: 3px; padding: 3px 6px; min-width: 0 }
input[type=number] { width: 84px; font-family: var(--mono); font-size: 12px }
textarea { width: 100%; font: 12px var(--mono); resize: vertical }
.orients { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px }
.orients button { padding: 3px 0; font: 12px var(--mono) }
.orients button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.checks { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none }
.check { position: relative; cursor: help; display: grid; grid-template-columns: 44px 1fr auto; gap: 2px 8px; align-items: baseline; padding: 6px 8px; border-radius: 3px; background: var(--die); border-left: 3px solid var(--info) }
.check .why { display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 6; background: var(--ink); color: var(--bg); padding: 8px 10px; border-radius: 3px; font-size: 12px; line-height: 1.45; box-shadow: 0 4px 14px rgb(0 0 0 / .25) }
.check .why b { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px; opacity: .75 }
.check:hover .why, .check:focus .why { display: block }
.check:hover, .check:focus { outline: 1px solid var(--line) }
.check.pass { border-left-color: var(--pass) } .check.warn { border-left-color: var(--warn) } .check.fail { border-left-color: var(--fail) }
.check .st { font: 600 11px var(--mono); text-transform: uppercase }
.check.pass .st { color: var(--pass) } .check.warn .st { color: var(--warn) } .check.fail .st { color: var(--fail) } .check.info .st { color: var(--info) }
.check .t { font-weight: 600 } .check .v { font: 12px var(--mono); font-variant-numeric: tabular-nums; text-align: right }
.check .d { grid-column: 2 / 4; font-size: 12px; color: var(--muted) }
.summary { display: flex; gap: 10px; font: 12px var(--mono) }
.summary b { font-weight: 600 }
.bar { height: 12px; display: flex; border-radius: 2px; overflow: hidden; background: var(--grid) }
.bar span { display: block; height: 100% }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted) }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px }
.tbl { width: 100%; border-collapse: collapse; font: 12px var(--mono); font-variant-numeric: tabular-nums }
.tbl td { padding: 2px 4px; border-bottom: 1px solid var(--grid) } .tbl td.n { text-align: right }
.tbl tr:hover td { background: var(--grid); cursor: default }
.scroll { max-height: 280px; overflow-y: auto }
.note { font-size: 12px; color: var(--muted); white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.note.open { display: block }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; justify-self: start }

.warnbox { font-size: 12px; padding: 6px 8px; border-radius: 3px; background: var(--die); border-left: 3px solid var(--warn) }
.ro .edit-only { display: none !important }
details > summary { cursor: pointer; font-size: 12px; color: var(--muted) }
@media (max-width: 860px) {
  .stage { height: min(62vh, 80vw); min-height: 300px }
  .keys { display: none }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }

<script>// Floorplan engine: instances, orientations, pins, nets and the ranked-rule checks.
// Pure functions, no DOM: the page inlines this file, and `node layout/floorplan/page/check.js`
// runs the same checks on layout/floorplan/variants.json.
// Units: um, tile origin at its lower-left. A placement {x, y, orient} puts the lower-left
// corner of the transformed bbox at (x, y), as in floorplan.json.
(function (root) {
  'use strict';

  // GDS orientations as (rotation k * 90 deg CCW, mirror about the x axis first), the same
  // decomposition as KLayout's DCplxTrans(mag, rot, mirror, u).
  const ORIENTS = {
    R0: [0, false], R90: [1, false], R180: [2, false], R270: [3, false],
    MX: [0, true], MXR90: [1, true], MY: [2, true], MYR90: [3, true],
  };
  const ORIENT_OF = {};
  for (const [n, [k, m]] of Object.entries(ORIENTS)) ORIENT_OF[k + (m ? 'm' : '')] = n;

  function rotPt(k, m, x, y) {
    if (m) y = -y;
    for (let i = 0; i < k; i++) [x, y] = [-y, x];
    return [x, y];
  }
  // Placed size of a w x h cell.
  function placedSize(orient, w, h) { return ORIENTS[orient][0] % 2 ? [h, w] : [w, h]; }
  // Map a cell-local point (cell bbox lower-left = 0,0) to tile coordinates.
  function mapPt(pl, w, h, x, y) {
    const [k, m] = ORIENTS[pl.orient];
    const cs = [[0, 0], [w, 0], [0, h], [w, h]].map(([a, b]) => rotPt(k, m, a, b));
    const mx = Math.min(...cs.map(c => c[0])), my = Math.min(...cs.map(c => c[1]));
    const [px, py] = rotPt(k, m, x, y);
    return [pl.x + px - mx, pl.y + py - my];
  }
  function mapRect(pl, w, h, r) {
    const a = mapPt(pl, w, h, r[0], r[1]), b = mapPt(pl, w, h, r[0] + r[2], r[1] + r[3]);
    return [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.abs(a[0] - b[0]), Math.abs(a[1] - b[1])];
  }
  // Orientation after rotating 90 CCW / mirroring top-bottom (MX) / left-right (MY) on screen.
  function compose(orient, op) {
    let [k, m] = ORIENTS[orient];
    if (op === 'rot') k = (k + 1) % 4;
    else if (op === 'mx') { k = (4 - k) % 4; m = !m; }
    else if (op === 'my') { k = (6 - k) % 4; m = !m; }
    return ORIENT_OF[k + (m ? 'm' : '')];
  }

  // ---- the netlist of the tile (docs/floorplan_spec.md, "What goes in the tile" + "Nets")
  function buildCatalog(data) {
    const C = data.cells, cat = {};
    // zones of the real (folded) chain, in its own frame (layout/gen/lna_chain.py): the input
    // section (Cin, Rb, Mref) and stage 1 in the front row (top), stages 4-6 in the back row
    // (bottom, across the 14 um moat). Placed R180, the front row sits over the RX pads.
    const chainZones = { input: [0, 35.21, 69.02, 35.26], stage1: [69.02, 35.21, 36.4, 20.73], late: [9.8, 0, 95.62, 21.21] };
    const real = (inst, cell, extra) => Object.assign({ inst, cell, w: C[cell].w, h: C[cell].h, pins: C[cell].pins, m4: C[cell].m4 || [], group: 'rx' }, extra || {});
    // macro pins: even spread of pin_order.cfg slots (LibreLane), an estimate until the DEF is read
    const W = ['$', '$', 'tx_en', 'tx_en_n', '$', '$', '$', 'rx_en', 'dbg_en', '$', '$', '$', 'comp_in', 'sc_phi1', 'sc_phi2', '$', '$']
      .concat([0, 1, 2, 3, 4, 5, 6, 7].map(i => `trim_out[${i}]`)).concat(Array(25).fill('$'));
    const mpins = {};
    W.forEach((n, i) => { if (n !== '$') mpins[n] = { layer: 'met3', x: 0, y: +((i + 1) * 190 / (W.length + 1)).toFixed(2), est: true }; });
    const N = [];
    for (const b of ['uio_oe', 'uio_out', 'uo_out', 'uio_in', 'ui_in']) for (let i = 7; i >= 0; i--) N.push(`${b}[${i}]`);
    N.push('rst_n', 'clk');
    N.forEach((n, i) => { mpins[n] = { layer: 'met2', x: +((i + 1) * 260 / 83).toFixed(2), y: 190, est: true }; });
    const list = [
      { inst: 'macro', cell: 'radio_digital', w: 260, h: 190, reshape: true, halo: 5, pins: mpins, m4: [[0, 0, 260, 190]], group: 'dig', label: 'radio_digital' },
      real('xchain', 'lna_chain', { zones: chainZones }),
      real('xdet', 'log_det'), real('xlpf', 'lpf_rc'),
      real('xavg', 'avg_sc'),
      real('xcomp', 'comp_ct'),
      real('xdac', 'r2r', { group: 'trim', overDecap: true }),   // met1-only: a MIM decap may sit on top
      C.ctrim_1p ? real('xctrim', 'ctrim_1p', { group: 'trim', label: 'Ctrim 1 pF' })     // laid out (layout/gen/ctrim_1p.py)
        : { inst: 'xctrim', cell: 'ctrim_1p', w: 23.5, h: 23.5, estimate: true, group: 'trim', label: 'Ctrim 1 pF',
          pins: { trim: { layer: 'met4', x: 1, y: 0.25 } }, m4: [[0, 0, 23.5, 23.5]] },
      real('xbias', 'bias_gen', { group: 'bias' }), real('xdbg', 'dbg_tg'),
      real('xtx.xring', 'tx_ring', { group: 'tx' }), real('xtx.xls', 'tx_ls', { group: 'tx' }),
      real('xtx.xlse_p', 'tx_ls_en', { group: 'tx' }), real('xtx.xlse_n', 'tx_ls_en', { group: 'tx' }),
      real('xtx.xdrv_p', 'tx_drv', { group: 'tx' }), real('xtx.xdrv_n', 'tx_drv', { group: 'tx' }),
    ];
    for (const b of list) cat[b.inst] = b;
    return cat;
  }
  const MIM_FF = 2.06;                 // fF / um2, cap_mim_m3_1 (xschem/gen/chain.py)
  const DECAPS = {
    xdeca: { cell: 'decap_vapwr', net: 'VAPWR', pf: 50, target: 18000, label: 'decap VAPWR' },
    xdecd: { cell: 'decap_vdpwr', net: 'VDPWR', pf: 30, target: 4100, label: 'decap VDPWR' },
  };

  // [name, class, from, to]; endpoints are "inst.pin" or "pad:<tile pin>"
  const NETS = [
    ['rx_p', 'rxin', 'pad:ua[0]', 'xchain.inp'], ['rx_n', 'rxin', 'pad:ua[1]', 'xchain.inn'],
    ['o1', 'rx', 'xchain.o1p', 'xdet.t1p'], ['o2', 'rx', 'xchain.o2p', 'xdet.t2p'], ['o3', 'rx', 'xchain.o3p', 'xdet.t3p'],
    ['o4', 'late', 'xchain.o4p', 'xdet.t4p'], ['o5', 'late', 'xchain.o5p', 'xdet.t5p'], ['out', 'late', 'xchain.outp', 'xdet.t6p'],
    ['det', 'rx', 'xdet.det', 'xlpf.in'], ['det dbg', 'rx', 'xdet.det', 'xdbg.a'], ['dbg', 'rx', 'xdbg.b', 'pad:ua[2]'],
    ['lpf', 'rx', 'xlpf.out', 'xavg.in'], ['lpf comp', 'rx', 'xlpf.out', 'xcomp.inn'], ['avg', 'rx', 'xavg.out', 'xcomp.inp'],   // xschem/gen/top.py: inp = avg, inn = lpf
    ['comp_in', 'clk', 'xcomp.out', 'macro.comp_in'],
    ['sc_phi1', 'clk', 'macro.sc_phi1', 'xavg.phi1'], ['sc_phi2', 'clk', 'macro.sc_phi2', 'xavg.phi2'],
    ['rx_en', 'en', 'macro.rx_en', 'xbias.en'], ['dbg_en', 'en', 'macro.dbg_en', 'xdbg.en'],
    ['tx_en key', 'en', 'macro.tx_en', 'xtx.xring.en'], ['tx_en', 'en', 'macro.tx_en', 'xtx.xlse_p.in'], ['tx_en_n', 'en', 'macro.tx_en_n', 'xtx.xlse_n.in'],
    ['clk', 'clk', 'pad:clk', 'macro.clk'],
  ].concat([0, 1, 2, 3, 4, 5, 6, 7].map(i => [`trim[${i}]`, 'trim', `macro.trim_out[${i}]`, `xdac.b${i}`])).concat([
    ['dac', 'trim', 'xdac.out', 'xctrim.trim'], ['trim', 'trim', 'xctrim.trim', 'xcomp.trim'],   // one net: Ctrim is a shunt cap (trim -> VGND)
    ['ib_chain', 'bias', 'xbias.ib_chain', 'xchain.ibias'], ['vcm', 'bias', 'xbias.vcm', 'xchain.vcm'],
    ['ib_det', 'bias', 'xbias.ib_det', 'xdet.ibias_det'], ['ib_comp', 'bias', 'xbias.ib_comp', 'xcomp.ibias'],
    ['ring', 'tx', 'xtx.xring.out', 'xtx.xls.in'], ['a', 'tx', 'xtx.xls.A', 'xtx.xdrv_p.in'], ['b', 'tx', 'xtx.xls.B', 'xtx.xdrv_n.in'],
    ['enh_p', 'tx', 'xtx.xlse_p.A', 'xtx.xdrv_p.en'], ['enh_n', 'tx', 'xtx.xlse_n.A', 'xtx.xdrv_n.en'],
    ['tx_p', 'tx', 'xtx.xdrv_p.out', 'pad:ua[3]'], ['tx_n', 'tx', 'xtx.xdrv_n.out', 'pad:ua[4]'],
  ]);
  const NET_CLASSES = {
    rxin: 'RX input', rx: 'RX signal', late: 'RX late stages', clk: 'clock / switching', en: 'enable (static in RX)', bias: 'bias', tx: 'TX', trim: 'trim',
  };

  const DEFAULT_SETTINGS = {
    keepout: 2.5,          // um between blocks (guard rings)
    channel: 12,           // um: TT digital pins -> macro north pins routing channel along the top
    strapY: 5,             // straps run from strapY to H - strapY
    r1: 100, r2: 60, r3: 20, r4: 320, r5: 40, r6: 60, r8: 40,
    deca: 18000, decd: 4100,
  };

  // ---- geometry
  const area = r => r[2] * r[3];
  function rectGap(a, b) {         // Euclidean gap between two rects (0 if touching/overlapping)
    const dx = Math.max(0, b[0] - (a[0] + a[2]), a[0] - (b[0] + b[2]));
    const dy = Math.max(0, b[1] - (a[1] + a[3]), a[1] - (b[1] + b[3]));
    return Math.hypot(dx, dy);
  }
  function overlap(a, b) {
    const w = Math.min(a[0] + a[2], b[0] + b[2]) - Math.max(a[0], b[0]);
    const h = Math.min(a[1] + a[3], b[1] + b[3]) - Math.max(a[1], b[1]);
    return w > 1e-6 && h > 1e-6 ? w * h : 0;
  }
  const segRect = (s) => [Math.min(s[0], s[2]), Math.min(s[1], s[3]), Math.abs(s[2] - s[0]), Math.abs(s[3] - s[1])];
  function segCrosses(s, r, margin) {   // axis-aligned segment passes through rect interior (shrunk by margin)
    const m = margin || 0, q = [r[0] + m, r[1] + m, r[2] - 2 * m, r[3] - 2 * m];
    if (q[2] <= 0 || q[3] <= 0) return false;
    const sr = segRect(s);
    return sr[0] < q[0] + q[2] && sr[0] + sr[2] > q[0] && sr[1] < q[1] + q[3] && sr[1] + sr[3] > q[1];
  }
  const manhattan = (a, b) => Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]);
  // Two L-shaped candidate routes; pick the one crossing fewer obstacles (ties: horizontal first).
  function lRoute(a, b, obstacles) {
    const r1 = [[a[0], a[1], b[0], a[1]], [b[0], a[1], b[0], b[1]]];
    const r2 = [[a[0], a[1], a[0], b[1]], [a[0], b[1], b[0], b[1]]];
    if (!obstacles || !obstacles.length) return r1;
    const hits = r => obstacles.filter(o => r.some(s => segCrosses(s, o, 0.6))).length;
    return hits(r2) < hits(r1) ? r2 : r1;
  }

  // ---- placement
  // A variant: {name, note, place: {inst: {x, y, orient}}, decaps: {xdeca: [{x,y,w,h}], ...},
  //             straps: [{net, x, w}], est: {xctrim: {w, h}}}
  function resolve(cat, v) {
    const inst = {};
    for (const [n, c] of Object.entries(cat)) {
      const p = (v.place || {})[n];
      if (!p) continue;
      const F = c.fold && v.fold && v.fold[n] ? c.fold : null;          // folded chain: its own size, pins, met4 and zones
      let w = F ? F.w : c.w, h = F ? F.h : c.h;
      const scaled = c.estimate || c.reshape;      // estimated blocks, and the macro (re-hardened at a new aspect ratio, same area)
      if (scaled && v.est && v.est[n]) { w = v.est[n].w; h = c.reshape ? (v.est[n].area || c.w * c.h) / w : v.est[n].h; }   // macro: est.area overrides the hardened area
      const pl = { x: p.x, y: p.y, orient: p.orient || 'R0' };
      const [pw, ph] = placedSize(pl.orient, w, h);
      const rect = [pl.x, pl.y, pw, ph];
      const pins = {};
      const sx = scaled ? w / c.w : 1, sy = scaled ? h / c.h : 1;
      const src = n === 'macro' ? macroPins(c, v) : F ? F.pins : c.pins;
      // moved pins (floorplanning): v.pins[inst][pin] = {x, y} in the block's own frame at its
      // placed size; they need a block re-layout (or, for the macro, a new pin_order.cfg)
      const mv = (v.pins || {})[n] || {};
      for (const [pn, pp] of Object.entries(src)) {
        const m = mv[pn];
        pins[pn] = Object.assign({}, pp, m ? { x: m.x, y: m.y, moved: true, at: mapPt(pl, w, h, m.x, m.y) } : { at: mapPt(pl, w, h, pp.x * sx, pp.y * sy) });
      }
      const m4 = ((F ? F.m4 : c.m4) || []).map(r => scaled ? [0, 0, w, h] : r).map(r => mapRect(pl, w, h, r));
      const zones = {};
      for (const [zn, z] of Object.entries((F ? F.zones : c.zones) || {})) zones[zn] = mapRect(pl, w, h, z);
      inst[n] = { name: n, cat: c, pl, w, h, rect, pins, m4, zones, folded: !!F,
        halo: c.halo ? [rect[0] - c.halo, rect[1] - c.halo, rect[2] + 2 * c.halo, rect[3] + 2 * c.halo] : null };
    }
    const decaps = [];
    for (const [n, d] of Object.entries(DECAPS)) ((v.decaps || {})[n] || []).forEach((r, i) =>
      decaps.push({ name: `${n}.${i + 1}`, base: n, idx: i, def: d, mim: !!r.mim, rect: [r.x, r.y, r.w, r.h] }));
    return { inst, decaps };
  }

  // The r2r trim drive (trim_out[7:0]) can move to another macro edge (a pin_order.cfg change
  // and a re-harden): W as hardened; S at the west end of the south edge; N after the 42 TT pins;
  // E at the same heights as on W. Coordinates in the 260 x 190 frame (scaled when reshaped).
  const TRIM_SIDES = { W: 'west (as hardened)', S: 'south', N: 'north', E: 'east' };
  function macroPins(c, v) {
    const side = (v.macroPins && v.macroPins.trim) || 'W';
    if (side === 'W') return c.pins;
    const p = Object.assign({}, c.pins);
    for (let i = 0; i < 8; i++) {
      const k = `trim_out[${i}]`, o = c.pins[k];
      const at = side === 'S' ? { x: +((i + 1) * 260 / 83).toFixed(2), y: 0 }
        : side === 'N' ? { x: +((i + 43) * 260 / 83).toFixed(2), y: 190 } : { x: 260, y: o.y };
      p[k] = Object.assign({}, o, at);
    }
    return p;
  }

  function pinAt(tile, R, ref) {
    if (ref.startsWith('pad:')) {
      const p = tile.pins[ref.slice(4)];
      if (!p) return null;
      return [(p.x0 + p.x1) / 2, p.y0 < 1 ? 0 : tile.h];
    }
    const i = ref.lastIndexOf('.');
    const ins = R.inst[ref.slice(0, i)];
    if (!ins) return null;
    const p = ins.pins[ref.slice(i + 1)];
    return p ? p.at : null;
  }

  // The TT digital pins (top edge) to the macro's pins: at each x, the channel along the top is as
  // tall as the number of wires running horizontally there x the track pitch (s.channel = all 42).
  // So it ramps up from x 15 to the last TT pin, is full height until the first macro pin, and
  // ramps down again over the macro as the wires land.
  function channelShapes(tile, R, s) {
    const m = R.inst.macro;
    if (!s.channel || !m) return [];
    const spans = [];
    for (const [n, tp] of Object.entries(tile.pins)) {
      if (tp.y0 < 1 || !m.pins[n]) continue;                            // top-edge TT pins the macro has
      const tx = (tp.x0 + tp.x1) / 2, mx = m.pins[n].at[0];
      spans.push([Math.min(tx, mx), Math.max(tx, mx)]);
    }
    if (!spans.length) return [];
    const pitch = s.channel / spans.length, xs = [...new Set(spans.flat())].sort((a, b) => a - b), out = [];
    for (let i = 0; i < xs.length - 1; i++) {
      const a = xs[i], b = xs[i + 1], mid = (a + b) / 2, k = spans.filter(([p, q]) => p <= mid && q >= mid).length;
      if (!k) continue;
      const h = k * pitch, last = out[out.length - 1];
      if (last && Math.abs(last[3] - h) < 1e-9 && Math.abs(last[0] + last[2] - a) < 1e-9) last[2] = b - last[0];
      else out.push([a, tile.h - h, b - a, h]);
    }
    return out;
  }
  function channelRect(tile, R, s) {                                   // bounding box of the channel
    const sh = channelShapes(tile, R, s);
    if (!sh.length) return null;
    const x0 = Math.min(...sh.map(r => r[0])), x1 = Math.max(...sh.map(r => r[0] + r[2])), y0 = Math.min(...sh.map(r => r[1]));
    return [x0, y0, x1 - x0, tile.h - y0];
  }

  function routeNets(tile, R) {
    const obst = Object.values(R.inst).map(i => i.rect);
    const out = [];
    for (const [name, cls, a, b] of NETS) {
      const pa = pinAt(tile, R, a), pb = pinAt(tile, R, b);
      if (!pa || !pb) { out.push({ name, cls, a, b, missing: true }); continue; }
      const ownA = a.startsWith('pad:') ? null : a.slice(0, a.lastIndexOf('.'));
      const ownB = b.startsWith('pad:') ? null : b.slice(0, b.lastIndexOf('.'));
      const others = Object.values(R.inst).filter(i => i.name !== ownA && i.name !== ownB).map(i => i.rect);
      out.push({ name, cls, a, b, pa, pb, len: manhattan(pa, pb), segs: lRoute(pa, pb, others) });
    }
    return out;
  }

  const fmt = (x, d) => (x === Infinity ? '-' : x.toFixed(d === undefined ? 0 : d));
  function minGapShapes(A, B) {     // A, B: arrays of rects or segments (as rects)
    let d = Infinity;
    for (const a of A) for (const b of B) d = Math.min(d, rectGap(a, b));
    return d;
  }

  // ---- checks: [{id, rule, title, status: pass|warn|fail|info, value, detail}]
  function evaluate(data, cat, v, settings) {
    const s = Object.assign({}, DEFAULT_SETTINGS, settings || {});
    const tile = data.tile, R = resolve(cat, v), nets = routeNets(tile, R);
    const I = R.inst, res = [];
    const add = (rule, title, status, value, detail) => res.push({ rule, title, status, value, detail: detail || '' });
    const netBy = n => nets.find(x => x.name === n);
    const segsOf = list => list.filter(n => n && !n.missing).flatMap(n => n.segs.map(segRect));
    const lvl = (x, pass, warn, higher) => higher ? (x >= pass ? 'pass' : x >= warn ? 'warn' : 'fail') : (x <= pass ? 'pass' : x <= warn ? 'warn' : 'fail');
    const chanSh = channelShapes(tile, R, s), chan = chanSh.length ? channelRect(tile, R, s) : null;
    const missing = Object.keys(cat).filter(n => !I[n]);

    // inputs: chain input section + pad wires; late: stages 4-6, log_det's t4-t6 row and their tap wires
    const A = I.xchain, D = I.xdet, M = I.macro;
    const inputZone = A ? [A.zones.input].concat(segsOf([netBy('rx_p'), netBy('rx_n')])) : [];
    const stage1 = A ? [A.zones.stage1] : [];

    // 1. chain input far from the digital macro and the TT digital wires
    if (A && M) {
      const dM = minGapShapes(inputZone, [M.halo]);
      const dig = segsOf([netBy('clk')]).concat(chanSh);
      const dC = minGapShapes(inputZone, dig);
      const d = Math.min(dM, dC);
      const crossers = nets.filter(n => !n.missing && (n.cls === 'clk' || n.cls === 'trim') &&
        n.segs.some(sg => [A.rect].some(r => segCrosses(sg, r, 0.6))));
      add(1, 'Chain input far from the macro', crossers.length ? 'fail' : lvl(d, s.r1, s.r1 / 2, true),
        `${fmt(dM)} µm`, `input ↔ macro halo ${fmt(dM)} µm, ↔ TT channel / clk ${fmt(dC)} µm (want ≥ ${s.r1}).` +
        (crossers.length ? ` Digital wires over the chain: ${crossers.map(n => n.name).join(', ')}.` : ' No macro wire over the chain.'));
    } else add(1, 'Chain input far from the macro', 'info', '-', 'Place the chain and the macro.');

    // 2. late stages / detector t4-t6 away from the input
    if (A && D) {
      const tLate = ['t4p', 't5p', 't6p', 't4n', 't5n', 't6n'].map(p => D.pins[p].at).map(q => [q[0] - 1, q[1] - 1, 2, 2]);
      const late = [A.zones.late].concat(tLate, segsOf([netBy('o4'), netBy('o5'), netBy('out')]));
      const d = minGapShapes(late, inputZone.concat(stage1));
      const dOut = minGapShapes([[A.pins.outp.at[0] - 1, A.pins.outp.at[1] - 1, 2, 2]], inputZone);
      const cross = segsOf([netBy('o4'), netBy('o5'), netBy('out')]).some(sg => inputZone.concat(stage1).some(z => rectGap(sg, z) === 0));
      add(2, 'Late stages away from the input', cross ? 'fail' : lvl(d, s.r2, s.r2 / 2, true), `${fmt(d)} µm`,
        `closest late-stage shape (stages 4-6, t4-t6, their tap wires) to the input section, pad wires or stage 1: ${fmt(d)} µm; ` +
        `stage 6 output ↔ input ${fmt(dOut)} µm (want ≥ ${s.r2}).`);
    } else add(2, 'Late stages away from the input', 'info', '-', 'Place the chain and log_det.');

    // 3. clock edges off the RX
    {
      const ck = ['sc_phi1', 'sc_phi2', 'comp_in', 'clk'].map(netBy).filter(n => n && !n.missing);
      const rxr = [A, D].filter(Boolean).map(i => i.rect);
      const crossing = ck.filter(n => n.segs.some(sg => rxr.some(r => segCrosses(sg, r, 0.6))));
      const d = minGapShapes(segsOf(ck), rxr);
      add(3, 'Clock edges off the RX', crossing.length ? 'fail' : lvl(d, s.r3, s.r3 / 2, true), crossing.length ? 'crosses' : `${fmt(d)} µm`,
        (crossing.length ? `Crossing the chain / log_det: ${crossing.map(n => n.name).join(', ')}. ` : 'phi lines cross RX: no. ') +
        `phi1/2, comp_in, clk ↔ chain / log_det ${fmt(d)} µm (want ≥ ${s.r3}).`);
    }

    // 4. short analog path
    {
      const p = ['det', 'lpf', 'lpf comp', 'avg', 'dac', 'trim'].map(netBy).filter(n => n && !n.missing);
      const sum = p.reduce((a, n) => a + n.len, 0), avg = netBy('avg');
      add(4, 'Short analog path', p.length < 6 ? 'info' : lvl(sum, s.r4, s.r4 * 1.5), `${fmt(sum)} µm`,
        p.map(n => `${n.name} ${fmt(n.len)}`).join(', ') + (avg && !avg.missing ? `; avg_sc.out → comp_ct.inn ${fmt(avg.len)} µm` : ''));
    }

    // 5. TX at the pads
    {
      const tp = netBy('tx_p'), tn = netBy('tx_n');
      if (tp && tn && !tp.missing && !tn.missing) {
        const m = Math.max(tp.len, tn.len), en = ['tx_en', 'tx_en_n', 'tx_en key'].map(netBy).filter(n => n && !n.missing);
        add(5, 'TX at ua[3] / ua[4]', lvl(m, s.r5, s.r5 * 2), `${fmt(m)} µm`,
          `driver → pad: tx_p ${fmt(tp.len)}, tx_n ${fmt(tn.len)} µm (met3, 2.5 µm wide; want ≤ ${s.r5}). Enables from the macro: ${en.map(n => fmt(n.len)).join(' / ')} µm.`);
      } else add(5, 'TX at ua[3] / ua[4]', 'info', '-', 'Place the TX drivers.');
    }

    // 6. bias near the chain
    {
      const c = ['ib_chain', 'vcm'].map(netBy).filter(n => n && !n.missing), o = ['ib_det', 'ib_comp'].map(netBy).filter(n => n && !n.missing);
      if (c.length === 2) {
        const m = Math.max(...c.map(n => n.len));
        add(6, 'Bias next to the chain', lvl(m, s.r6, s.r6 * 2), `${fmt(m)} µm`,
          `ib_chain ${fmt(c[0].len)}, vcm ${fmt(c[1].len)} µm (want ≤ ${s.r6}); ` + o.map(n => `${n.name} ${fmt(n.len)}`).join(', ') + ' µm.');
      } else add(6, 'Bias next to the chain', 'info', '-', 'Place bias_gen and the chain.');
    }

    // 7. decaps
    for (const [n, d] of Object.entries(DECAPS)) {
      // decap tiles at the estimate's density (d.pf per target area); MIM-only rectangles over a block at 2.06 fF/um2
      const ds = R.decaps.filter(x => x.base === n), tgt = s[n === 'xdeca' ? 'deca' : 'decd'];
      const a = ds.filter(x => !x.mim).reduce((t, x) => t + area(x.rect), 0), am = ds.filter(x => x.mim).reduce((t, x) => t + area(x.rect), 0);
      const pf = d.pf * a / tgt + MIM_FF * am / 1000;
      add(7, `Decap ${d.net}`, lvl(pf / d.pf, 1, 0.7, true), `${fmt(100 * pf / d.pf)} %`,
        `≈ ${fmt(pf, 1)} of ${d.pf} pF: ${fmt(a)} µm² of decap tiles (of ${fmt(tgt)})` + (am ? ` + ${fmt(am)} µm² MIM over blocks` : '') + `, ${ds.length} rectangle(s).`);
    }

    // 8. TX vs RX (soft)
    {
      const tx = Object.values(I).filter(i => i.cat.group === 'tx');
      if (tx.length && A) {
        const d = minGapShapes(tx.map(i => i.rect), [A.zones.input].concat(stage1));
        add(8, 'TX away from the RX input', d >= s.r8 ? 'pass' : 'warn', `${fmt(d)} µm`,
          `TX blocks ↔ chain input section and stage 1: ${fmt(d)} µm (soft, want ≥ ${s.r8}; the TX is idle in RX).`);
      }
    }

    // 9. spacing, bounds, macro halo, routing channel
    {
      const boxes = Object.values(I).map(i => ({ n: i.name, r: i.rect, halo: i.halo, over: i.cat.overDecap })).concat(R.decaps.map(d => ({ n: d.name, r: d.rect, mim: d.mim })));
      const inside = (q, r) => q[0] >= r[0] - 1e-6 && q[1] >= r[1] - 1e-6 && q[0] + q[2] <= r[0] + r[2] + 1e-6 && q[1] + q[3] <= r[1] + r[3] + 1e-6;
      const stacked = (a, b) => (a.over && b.mim && inside(b.r, a.r)) || (b.over && a.mim && inside(a.r, b.r));   // MIM decap on top of a met1-only block
      const over = [], tight = [], outside = [], inChan = [];
      for (let i = 0; i < boxes.length; i++) {
        const a = boxes[i], r = a.r;
        if (r[0] < -1e-6 || r[1] < -1e-6 || r[0] + r[2] > tile.w + 1e-6 || r[1] + r[3] > tile.h + 1e-6) outside.push(a.n);
        if (a.n !== 'macro' && chanSh.some(c => overlap(r, c) > 0)) inChan.push(a.n);
        for (let j = i + 1; j < boxes.length; j++) {
          const b = boxes[j];
          const ra = a.halo || r, rb = b.halo || b.r;
          if (stacked(a, b)) continue;
          if (overlap(ra, rb) > 0.01) over.push(`${a.n} / ${b.n}`);
          else if (!a.halo && !b.halo && rectGap(r, b.r) < s.keepout - 1e-3) tight.push(`${a.n} / ${b.n} ${fmt(rectGap(r, b.r), 1)}`);
        }
      }
      add(9, 'Overlaps and spacing', over.length || outside.length ? 'fail' : tight.length ? 'warn' : 'pass',
        over.length ? `${over.length} overlap${over.length > 1 ? 's' : ''}` : tight.length ? `${tight.length} tight` : 'none',
        (over.length ? `Overlapping (halo counts): ${over.join(', ')}. ` : 'overlaps: none. ') +
        (outside.length ? `Outside the tile: ${outside.join(', ')}. ` : '') +
        (tight.length ? `Closer than ${s.keepout} µm: ${tight.join(', ')}.` : `All gaps ≥ ${s.keepout} µm.`));
      if (chan) {
        const above = M ? tile.h - (M.rect[1] + M.rect[3]) : 0;
        const need = M ? Math.max(0, ...chanSh.filter(c => c[0] < M.rect[0] + M.rect[2] && c[0] + c[2] > M.rect[0]).map(c => c[3])) : 0;
        const full = Math.max(...chanSh.map(c => c[3]));
        const st = inChan.length ? 'fail' : above + 1e-6 < need ? 'fail' : 'pass';
        add(9, 'TT pin channel clear', st, `${fmt(above, 1)} µm`,
          `The 42 TT pins (x 15-131) run along the top to the macro's pins: the channel is as tall as the wires crossing each x (${fmt(full, 1)} µm where all ${Math.round(full / (s.channel / 42))} run side by side, at ${fmt(s.channel / 42, 2)} µm per track). ` +
          `Over the macro it needs ${fmt(need, 1)} µm; there is ${fmt(above, 1)} µm above the macro body.` +
          (inChan.length ? ` Blocks in the channel: ${inChan.join(', ')}.` : '') +
          (above + 1e-6 < need ? ' Move the macro down, or put its TT pins nearer the TT pins.' : ''));
      }
    }

    // straps: full-height met4 lanes must clear every met4 / MIM shape and the macro
    {
      const ys = s.strapY, obs = Object.values(I).flatMap(i => i.m4.map(r => ({ n: i.name, r }))).concat(R.decaps.filter(d => d.mim).map(d => ({ n: d.name, r: d.rect })));
      const issues = [], nets = new Set();
      (v.straps || []).forEach((st, i) => {
        nets.add(st.net);
        const lane = [st.x - 0.3, ys, st.w + 0.6, tile.h - 2 * ys];
        const hit = [...new Set(obs.filter(o => overlap(lane, o.r) > 0).map(o => o.n))];
        if (hit.length) issues.push(`${st.net} @ ${fmt(st.x, 1)} blocked by ${hit.join(', ')} met4`);
        if (st.w < 1.2) issues.push(`${st.net} @ ${fmt(st.x, 1)} narrower than 1.2 µm`);
        (v.straps || []).slice(i + 1).forEach(o => { if (rectGap([st.x, 0, st.w, 1], [o.x, 0, o.w, 1]) < 0.3) issues.push(`${st.net} / ${o.net} straps touch`); });
      });
      const miss = ['VDPWR', 'VAPWR', 'VGND'].filter(n => !nets.has(n));
      add('P', 'Power straps', issues.length ? 'fail' : miss.length ? 'warn' : 'pass',

    const cf = $('#cFold'); if (cf) cf.onchange = () => {

        // moved pins (own frame) follow the edges: scale along each edge, stay on the edge they were on

    el.querySelectorAll('[data-or]').forEach(b => b.onclick = () => setOrient(n, b.dataset.or));
    const bp = $('#bPark'); if (bp) bp.onclick = () => { delete v.place[n]; touch(); };

  } else if (S.sel.kind === 'decap') {
    const [base, i] = S.sel.id.split('.'); const list = v.decaps[base]; const d = list && list[+i - 1];
    if (!d) { S.sel = null; return renderSel(); }
    const def = FP.DECAPS[base];

      <div class="row"><label class="f">x<input type="number" step="0.5" id="dx" value="${f1(d.x)}"></label><label class="f">y<input type="number" step="0.5" id="dy" value="${f1(d.y)}"></label>

// Why each rule exists (docs/floorplan_spec.md "Rules, ranked" and the results behind it)
const WHY = {
  'Chain input far from the macro': 'The macro runs at 10 MHz and its 43rd / 44th harmonics (430 / 440 MHz) fall in the chain\'s 330-560 MHz band; the correlator runs all the time in RX. Anything coupled into the chain input is amplified ~80 dB, so the input section and the ua[0] / ua[1] pad wires should be as far as possible from the macro, its supply and the TT-pin wiring. Measured from the input section + pad wires to the macro halo and the TT channel / clk wire. Fails if a switching macro wire (comp_in, phi, clk, trim) crosses the chain.',
  'Late stages away from the input': 'With ~80 dB of gain, output-to-input coupling above ~0.1 fF (asymmetric) makes the chain peak or oscillate: at the ss 10 °C corner 0.2 fF gives +2.8 dB of peaking near 600 MHz and 0.5 fF oscillates. Stages 4-6, log_det\'s t4-t6 inputs and their tap wires carry the large signal, so they must stay away from the pads, the input wires and stage 1.',
  'Clock edges off the RX': 'sc_phi1 / sc_phi2 (to avg_sc), comp_in (from comp_ct) and clk switch during RX. Their edges couple into the chain and the detector, which see µV-level signals. Fails if one of these wires crosses the chain or log_det; warns when it passes closer than the threshold. Also keep the phi lines off avg_sc\'s Cavg top plates.',
  'Short analog path': 'det -> lpf -> avg_sc / comp_ct and r2r -> Ctrim -> comp.trim are slow, high-impedance nodes where tenths of a mV matter (the trim step is ~0.07 mV per LSB). Short wires keep pickup, leakage and parasitic capacitance down. The value is the sum of those Manhattan lengths.',
  'TX at ua[3] / ua[4]': 'The drivers deliver about +4 dBm at 434 MHz, and the driver -> pad wires carry the full output current (met3, 2.5 µm wide for electromigration). Long ones add loss and inductance, and act as an antenna inside the tile.',
  'Bias next to the chain': 'ib_chain (60 µA into the chain\'s current mirror) and vcm (the input common mode, through Rb) set the gain and operating point of the most sensitive block. Long wires pick up noise and coupling; ib_det and ib_comp are less critical and only reported.',
  'Decap VAPWR': 'About 50 pF on VAPWR (3.3 V) keeps ~1 V peak-to-peak of 434 MHz TX ripple off the chip\'s shared 3.3 V net, which other projects use and which would also radiate. At 30 pF the ripple rises from ~0.05 to ~0.15 V; that is the lever if area runs out. Not laid out yet: area is the estimate.',
  'Decap VDPWR': 'About 30 pF on VDPWR (1.8 V) holds up the RX and digital supply; with 30 pF the chain stays stable with up to 5 nH of supply / ground inductance. Not laid out yet: area is the estimate.',
  'TX away from the RX input': 'Soft rule: the radio is half-duplex and the TX is stopped in RX (ring off, both arms low), so TX / RX distance only matters for leakage while transmitting. Never at the cost of rules 1 and 2.',
  'Overlaps and spacing': 'Blocks need about 2-3 µm between them for guard rings and wiring (the keep-out setting). Nothing may overlap another block, sit outside the tile, or enter the macro\'s 5 µm halo.',
  'TT pin channel clear': 'The 42 TT digital pins (top edge, x 15-131) connect to the macro\'s north pins. About 42 wires run horizontally above the analog area and drop into the macro from above, which needs a channel of ~12 µm. If the macro\'s top is closer to the tile edge than that, its north pins can\'t be reached.',
  'Power straps': 'Power reaches the TT PDN through vertical met4 straps (≥ 1.2 µm wide, nearly full height); met5 is reserved for the TT PDN. A strap can\'t cross met4 shapes or MIM top plates (cap_mim_m3_1), nor the macro, which routes up to met4. Each net (VGND, VAPWR, VDPWR) needs at least one; turn on the met4 / MIM layer to see what blocks a lane.',
  'Unplaced blocks': 'Blocks still in the parking row under the tile are left out of every check. Place them to have them scored.',
};

function renderChecks() {
  const el = $('#secChecks');
  if (!last) { el.innerHTML = '<h2>Checklist</h2><p class="empty">Rules appear once a variant is open.</p>'; return; }
  const cs = last.checks, n = (s) => cs.filter(c => c.status === s).length;
  el.innerHTML = `<h2>Checklist <span class="meta">ranked rules, live</span></h2>
    <div class="summary"><span style="color:var(--fail)"><b>${n('fail')}</b> fail</span><span style="color:var(--warn)"><b>${n('warn')}</b> warn</span><span style="color:var(--pass)"><b>${n('pass')}</b> pass</span></div>
    <ol class="checks">${cs.map(c => `<li class="check ${c.status}" tabindex="0">${badge(c.status)}<span class="t">${c.rule}. ${esc(c.title)}</span><span class="v">${esc(c.value)}</span><span class="d">${esc(c.detail)}</span>${WHY[c.title] ? `<div class="why" role="tooltip"><b>Why</b>${esc(WHY[c.title])}</div>` : ''}</li>`).join('')}</ol>`;
}

    <div class="bar" role="img" aria-label="Area use"><span style="width:${pct(a.signal)}%;background:var(--rx)"></span><span style="width:${pct(a.decap)}%;background:var(--decap)"></span><span style="width:${pct(a.spacing)}%;background:var(--warn)"></span></div>
    <div class="legend"><span><i class="sw" style="background:var(--rx)"></i>signal ${k(a.signal)}</span><span><i class="sw" style="background:var(--decap)"></i>decap ${k(a.decap)} of ${k(a.decapTarget)}</span><span><i class="sw" style="background:var(--warn)"></i>spacing +10 % ${k(a.spacing)}</span></div>

}

function renderStraps() {

    <div class="row edit-only"><button class="btn" id="bStrap">Add a strap</button><button class="btn" id="bDecA">Add VAPWR decap</button><button class="btn" id="bDecD">Add VDPWR decap</button></div>

async function saveFile(name, text) {

}

let delArm = 0;
$('#bDel').onclick = () => {
  const b = $('#bDel');
  if (Date.now() - delArm > 3000) { delArm = Date.now(); b.textContent = 'Delete? click again'; setTimeout(() => { b.textContent = 'Delete'; }, 3000); return; }
  delArm = 0; b.textContent = 'Delete';
  const id = S.cur; delete S.variants[id]; sortOrder(); S.cur = S.order[0] || null; S.sel = null;
  S.dirty.add(id); flush(id); render();
};
$('#tabs').addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab]'); if (!t) return;
  S.cur = t.dataset.tab; S.sel = null; try { localStorage.setItem('fp.cur', S.cur); } catch (err) {} fit(); render();
});

// ---- canvas interaction
const svg = $('#cv');
let drag = null;
function setOrient(n, o) {
  const v = cur(), vv = viewVariant(v), p = vv.place[n], c = CAT[n];
  const est = v.est && v.est[n] ? v.est[n] : { w: c.w, h: c.h };
  const [w0, h0] = FP.placedSize(p.orient, est.w, est.h), [w1, h1] = FP.placedSize(o, est.w, est.h);
  v.place[n] = { x: snap(p.x + (w0 - w1) / 2), y: snap(p.y + (h0 - h1) / 2), orient: o };
  touch();
}
svg.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  if (S.mode === 'diagram') {
    const g = e.target.closest('[data-dinst]');
    if (g && CAT[g.dataset.dinst]) { S.sel = { kind: 'inst', id: g.dataset.dinst }; setMode('layout'); render(); }
    return;
  }
  const v = cur(); const [x, y] = toUm(e);
  let gi = e.target.closest('[data-inst]'), gd = e.target.closest('[data-decap]'); const gs = e.target.closest('[data-strap]');
  if (v && !gi && !gd && !gs && !e.target.closest('[data-resize]')) {   // a flyline or label on top: hit-test the blocks underneath
    const R0 = FP.resolve(CAT, viewVariant(v)), inR = (r) => x >= r[0] && x <= r[0] + r[2] && y >= r[1] && y <= r[1] + r[3];
    const bi = Object.values(R0.inst).filter(i => inR(i.rect)).sort((a, b) => a.rect[2] * a.rect[3] - b.rect[2] * b.rect[3])[0];
    const bd = S.layers.decap ? R0.decaps.filter(d => inR(d.rect)).sort((a, b) => a.rect[2] * a.rect[3] - b.rect[2] * b.rect[3])[0] : null;
    const pick = bi && bd ? (bi.rect[2] * bi.rect[3] <= bd.rect[2] * bd.rect[3] ? 'i' : 'd') : bi ? 'i' : bd ? 'd' : null;

  }

  }
  const hit = gi ? { kind: 'inst', id: gi.dataset.inst } : gd && !e.target.dataset.resize ? { kind: 'decap', id: gd.dataset.decap } : null;
  if (v && S.canWrite && hit && S.sel && S.sel.kind === 'group' && isSel(hit.kind, hit.id)) {   // drag the whole group
    drag = { kind: 'group', x0: x, y0: y, orig: S.sel.items.map(q => [q, itemPos(v, q)]) }; S.dragging = true; render(); return;
  }
  if (v && S.canWrite && gi) {
    const n = gi.dataset.inst, p = viewVariant(v).place[n];
    S.sel = { kind: 'inst', id: n }; drag = { kind: 'inst', n, dx: x - p.x, dy: y - p.y, p0: p, moved: false };
  } else if (v && S.canWrite && gd) {
    const [base, i] = gd.dataset.decap.split('.'), d = v.decaps[base][+i - 1];
    S.sel = { kind: 'decap', id: gd.dataset.decap };
    drag = e.target.dataset.resize ? { kind: 'resize', d, x0: d.x, y1: d.y + d.h } : { kind: 'decap', d, dx: x - d.x, dy: y - d.y };
  } else if (v && S.canWrite && gs) {
    const st = v.straps[+gs.dataset.strap]; S.sel = { kind: 'strap', id: +gs.dataset.strap }; drag = { kind: 'strap', st, dx: x - st.x };
  } else if (!S.canWrite && (gi || gd || gs)) {
    S.sel = gi ? { kind: 'inst', id: gi.dataset.inst } : gd ? { kind: 'decap', id: gd.dataset.decap } : { kind: 'strap', id: +gs.dataset.strap };
    drag = { kind: 'pan', cx: e.clientX, cy: e.clientY, v0: Object.assign({}, S.view) };
  } else {
    if (e.target === svg || !e.target.closest('[data-net]')) S.sel = null;
    drag = { kind: 'pan', cx: e.clientX, cy: e.clientY, v0: Object.assign({}, S.view) }; svg.classList.add('panning');
  }

  render();
});
svg.addEventListener('pointermove', (e) => {
  const [x, y] = toUm(e);
  $('#coords').textContent = `x ${x.toFixed(1)}, y ${y.toFixed(1)} µm`;
  const tip = $('#tip');
  const tn = e.target.closest && e.target.closest('[data-net]');
  if (tn && last && !drag) {
    const n = last.nets.find(q => q.name === tn.dataset.net);
    if (n) { const r = $('#stage').getBoundingClientRect(); tip.hidden = false; tip.textContent = `${n.name}: ${n.a.replace('pad:', '')} → ${n.b.replace('pad:', '')}  ${n.len.toFixed(1)} µm`; tip.style.left = (e.clientX - r.left + 12) + 'px'; tip.style.top = (e.clientY - r.top + 12) + 'px'; }
    if (S.hoverNet !== n.name) { S.hoverNet = n.name; draw(); }
  } else if (!drag) { tip.hidden = true; if (S.hoverNet) { S.hoverNet = null; draw(); } }
  if (!drag) return;
  const v = cur();
  if (drag.kind === 'pan') {
    const r = svg.getBoundingClientRect();
    S.view.x = drag.v0.x - (e.clientX - drag.cx) / r.width * S.view.w;
    S.view.y = drag.v0.y - (e.clientY - drag.cy) / r.height * S.view.h;
    draw(); return;
  }
  if (drag.kind === 'band') { drag.x1 = x; drag.y1 = y; draw(); return; }
  if (drag.kind === 'group') {
    const dx = snap(x - drag.x0), dy = snap(y - drag.y0);
    for (const [q, o] of drag.orig) setItemPos(v, q, +(o.x + dx).toFixed(3), +(o.y + dy).toFixed(3), o);
    drag.moved = dx !== 0 || dy !== 0; draw(); renderChecks(); return;
  }
  if (drag.kind === 'inst') { v.place[drag.n] = { x: snap(x - drag.dx), y: snap(y - drag.dy), orient: drag.p0.orient }; drag.moved = true; }
  else if (drag.kind === 'decap') { drag.d.x = snap(x - drag.dx); drag.d.y = snap(y - drag.dy); }
  else if (drag.kind === 'resize') { drag.d.w = Math.max(2, snap(x - drag.x0)); const ny = Math.min(drag.y1 - 2, snap(y)); drag.d.h = drag.y1 - ny; drag.d.y = ny; }

});
function endDrag() {
  if (!drag) return;
  const was = drag; drag = null; S.dragging = false; svg.classList.remove('panning');
  if (was.kind === 'band') {
    const v = cur(), b = [Math.min(was.x0, was.x1), Math.min(was.y0, was.y1), Math.abs(was.x1 - was.x0), Math.abs(was.y1 - was.y0)];
    const R0 = FP.resolve(CAT, viewVariant(v)), items = was.keep.slice();
    const add = (kind, id) => { if (!items.some(q => q.kind === kind && q.id === id)) items.push({ kind, id }); };
    if (b[2] > 0.5 || b[3] > 0.5) {
      for (const i of Object.values(R0.inst)) if (FP.overlap(i.rect, b) > 0) add('inst', i.name);
      if (S.layers.decap) for (const d of R0.decaps) if (FP.overlap(d.rect, b) > 0) add('decap', d.name);
    }
    setGroup(items); render(); return;
  }

}
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);
svg.addEventListener('wheel', (e) => {
  if (S.mode === 'diagram') return;
  e.preventDefault();
  const r = svg.getBoundingClientRect(), k = Math.exp(e.deltaY * 0.0015);
  const fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
  const nw = Math.min(2000, Math.max(20, S.view.w * k)), nh = S.view.h * nw / S.view.w;
  S.view.x += (S.view.w - nw) * fx; S.view.y += (S.view.h - nh) * fy; S.view.w = nw; S.view.h = nh;
  draw();
}, { passive: false });
document.addEventListener('keydown', (e) => {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement && document.activeElement.tagName)) return;
  if (S.mode === 'diagram') return;
  if (e.key === 'f' || e.key === 'F') { fit(); draw(); return; }
  if (e.key === 'Escape' && S.sel) { S.sel = null; render(); return; }

    if (dir) { e.preventDefault(); moveGroup(v, dir[0], dir[1]); touch(); }
    return;
  }
  if (S.sel.kind === 'inst') {
    const n = S.sel.id, p = viewVariant(v).place[n];
    const op = { r: 'rot', R: 'rot', x: 'mx', X: 'mx', y: 'my', Y: 'my' }[e.key];
    if (op) { setOrient(n, FP.compose(p.orient, op)); e.preventDefault(); return; }
  }
  const st = e.shiftKey ? 5 : 0.5, dir = { ArrowLeft: [-st, 0], ArrowRight: [st, 0], ArrowUp: [0, st], ArrowDown: [0, -st] }[e.key];
  if (!dir) return;
  e.preventDefault();
  if (S.sel.kind === 'inst') { const p = viewVariant(v).place[S.sel.id]; v.place[S.sel.id] = { x: p.x + dir[0], y: p.y + dir[1], orient: p.orient }; }
  else if (S.sel.kind === 'decap') { const [b, i] = S.sel.id.split('.'); const d = v.decaps[b][+i - 1]; d.x += dir[0]; d.y += dir[1]; }
  else if (S.sel.kind === 'strap') { v.straps[S.sel.id].x = Math.round((v.straps[S.sel.id].x + dir[0] / 5) * 10) / 10; }
  touch();
});
new ResizeObserver(() => { const old = S.view; fit(); if (old) { /* keep zoom on resize only when first fitting */ } draw(); }).observe($('#stage'));

renderLayers();
if (window.FP_DEV_VARIANTS) {        // local preview hook (not used in the published page)
  for (const v of window.FP_DEV_VARIANTS) { S.variants[v.id] = clone(v); }
  sortOrder(); S.cur = S.order[0];
}
render();
connect();
})();
